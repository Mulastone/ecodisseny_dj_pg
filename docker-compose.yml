version: '3.8'

services:
  # Base de d        echo '📚 Cargando documentación...' &&
        python manage.py cargar_documentacion --update &&
        echo '🧹 Limpiando documentos huérfanos...' &&
        python manage.py limpiar_documentos &&
        echo '📁 Recolectando archivos estáticos...' &&
        python manage.py collectstatic --noinput &&
        echo '🚀 Iniciando servidor Django...' &&
        python manage.py runserver 0.0.0.0:8000
      "
    expose:
      - "8000"
    volumes:
      - .:/app
      - static_files:/app/static
      - media_files:/app/media
    environment:
      - DEBUG=False
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=ecodisseny_db
      - DB_USER=ecodisseny
      - DB_PASSWORD=ecodisseny2024
      - ALLOWED_HOSTS=localhost,127.0.0.1,app.arasmu.net,161.97.147.142b:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecodisseny_db
      POSTGRES_USER: ecodisseny
      POSTGRES_PASSWORD: ecodisseny2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecodisseny -d ecodisseny_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplicación Django
  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "
        echo '🔄 Esperando PostgreSQL...' &&
        while ! pg_isready -h db -p 5432 -U ecodisseny; do
          echo 'PostgreSQL no está listo - esperando...'
          sleep 2
        done &&
        echo '✅ PostgreSQL está listo!' &&
        echo '🔄 Ejecutando migraciones...' &&
        python manage.py makemigrations &&
        python manage.py migrate &&
        echo '📥 Cargando fixtures...' &&
        ./docker-load-fixtures.sh &&
        echo '� Cargando documentación...' &&
        python manage.py cargar_documentacion --update &&
        echo '🧹 Limpiando documentos huérfanos...' &&
        python manage.py limpiar_documentos &&
        echo '�🚀 Iniciando servidor Django...' &&
        python manage.py runserver 0.0.0.0:8000
      "
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media_files:/app/media
    environment:
      - DEBUG=True
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=ecodisseny_db
      - DB_USER=ecodisseny
      - DB_PASSWORD=ecodisseny2024
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_files:
  media_files:
