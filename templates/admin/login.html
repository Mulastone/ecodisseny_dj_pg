{% load static %}
<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <title>Ecodisseny - Administració</title>
    
    <!-- Bootstrap + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        html, body { 
            height: 100%; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            overflow-x: hidden; 
            background: #343a40;
        }
        
        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        @media (max-width: 576px) {
            .login-container {
                align-items: flex-start;
                justify-content: flex-start;
                padding: 0;
            }
            .login-card {
                padding: 18px 8px;
                max-width: 100vw;
                min-width: 0;
                margin: 0;
                border-radius: 0;
                box-shadow: none;
            }
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        @media (max-width: 576px) {
            .login-container {
                padding: 0;
            }
            .login-card {
                padding: 18px 12px;
                max-width: 100vw;
                min-width: 0;
                box-shadow: 0 8px 18px rgba(0,0,0,0.08);
            }
            .logo-container img {
                max-width: 100px;
            }
            .system-title {
                font-size: 1.15rem;
                margin: 12px 0 8px 0;
            }
            .system-subtitle {
                font-size: 0.9rem;
                margin-bottom: 18px;
            }
            .form-floating {
                margin-bottom: 16px;
            }
            .form-floating input {
                font-size: 1rem;
                padding: 10px 12px;
            }
            .btn-login {
                font-size: 1rem;
                padding: 10px;
            }
            .back-to-app {
                margin-top: 16px;
            }
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-container img {
            max-width: 150px;
            height: auto;
        }
        
        .system-title {
            color: #495057;
            font-size: 1.5rem;
            font-weight: 600;
            margin: 20px 0 10px 0;
            text-align: center;
        }
        
        .system-subtitle {
            color: #6c757d;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .form-floating {
            margin-bottom: 20px;
        }
        
        .form-floating input {
            border-radius: 10px;
            border: 1px solid #dee2e6;
            background: rgba(255, 255, 255, 0.9);
        }
        
        .form-floating input:focus {
            border-color: #495057;
            box-shadow: 0 0 0 0.2rem rgba(73, 80, 87, 0.25);
        }
        
        .btn-login {
            background: #495057;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            padding: 12px;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        
        .btn-login:hover {
            background: #6c757d;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(73, 80, 87, 0.4);
            color: white;
        }
        
        .alert {
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .back-to-app {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-to-app a {
            color: #6c757d;
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .back-to-app a:hover {
            text-decoration: underline;
        }
        
        .admin-badge {
            background: #495057;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-container">
                <img src="{% static 'logo_ecodisseny_positiu.png' %}" alt="Ecodisseny" class="logo">
            </div>
            
            <div class="text-center">
                <span class="admin-badge">
                    <i class="bi bi-gear-fill"></i> Zona d'Administració
                </span>
            </div>
            
            <h2 class="system-title">Sistema de Gestió</h2>
            <p class="system-subtitle">Inicia sessió per administrar el sistema</p>
            
            {% if form.errors %}
                <div class="alert alert-danger" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    Les credencials introduïdes no són correctes. Torna-ho a provar.
                </div>
            {% endif %}
            
            <form method="post" action="{% url 'admin:login' %}">
                {% csrf_token %}
                
                <div class="form-floating">
                    <input type="text" 
                           class="form-control" 
                           id="id_username" 
                           name="username" 
                           placeholder="Nom d'usuari"
                           value="{{ form.username.value|default:'' }}"
                           required>
                    <label for="id_username">
                        <i class="bi bi-person-fill me-2"></i>Nom d'usuari
                    </label>
                </div>
                
                <div class="form-floating">
                    <input type="password" 
                           class="form-control" 
                           id="id_password" 
                           name="password" 
                           placeholder="Contrasenya"
                           required>
                    <label for="id_password">
                        <i class="bi bi-lock-fill me-2"></i>Contrasenya
                    </label>
                </div>
                
                <input type="hidden" name="next" value="{{ next }}">
                
                <button type="submit" class="btn btn-login">
                    <i class="bi bi-box-arrow-in-right me-2"></i>INICIAR SESSIÓ
                </button>
            </form>
            
            <div class="back-to-app">
                <a href="{% url 'home' %}">
                    <i class="bi bi-arrow-left me-1"></i>Tornar a l'aplicació principal
                </a>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
