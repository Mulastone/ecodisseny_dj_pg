# Configuración Nginx para VPS - app.arasmu.net
# Para usa    # Favicon
    location = /favicon.ico {
        alias /var/lib/docker/volumes/ecodisseny_dj_pg_static_volume/_data/favicon.ico;on docker-compose en el VPS

# Redirección HTTP a HTTPS
server {
    listen 80;
    server_name app.arasmu.net 161.97.147.142;
    return 301 https://$server_name$request_uri;
}

# Configuración HTTPS principal
server {
    listen 443 ssl http2;
    server_name app.arasmu.net 161.97.147.142;

    # Certificados SSL (configurados por Certbot)
    # ssl_certificate /etc/letsencrypt/live/app.arasmu.net/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.arasmu.net/privkey.pem;

    # Configuración SSL moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Headers de seguridad
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Configuración de archivos
    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Archivos estáticos (servidos desde volumen Docker)
    location /static/ {
        alias /var/lib/docker/volumes/ecodisseny_dj_pg_static_volume/_data/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        
        # Compresión
        gzip on;
        gzip_vary on;
        gzip_types text/css application/javascript image/svg+xml;
    }

    # Archivos media (uploads de usuarios)
    location /media/ {
        alias /var/lib/docker/volumes/ecodisseny_dj_pg_media_volume/_data/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Favicon
    location /favicon.ico {
        alias /var/lib/docker/volumes/ecodisseny_dj_pg_static_files/_data/favicon.ico;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Aplicación Django (proxy a Docker)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffers para mejor rendimiento
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Logs específicos
    access_log /var/log/nginx/app.arasmu.net.access.log;
    error_log /var/log/nginx/app.arasmu.net.error.log;
}
